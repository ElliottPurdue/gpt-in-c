# The point of running this in CI is that the repository's central claim --
# every gradient matches PyTorch, and the tests would notice if one did not --
# becomes checkable by anyone rather than asserted in a README.
#
# The oracle data is not committed, so CI regenerates it from ref/*.py on every
# run. That costs a PyTorch install, and it is the right trade: a committed
# binary blob proves only that the blob and the code agree, not that either
# matches what PyTorch computes today.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU) and NumPy
        # numpy is explicit: the oracle writer calls .numpy(), and the CPU torch
        # wheel does not always pull it in.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy
          python -c "import torch, numpy; print('torch', torch.__version__, '| numpy', numpy.__version__)"

      - name: Generate the oracle
        run: make oracle PYTHON=python

      - name: Report the floating-point environment
        # -msse2 -mfpmath=sse is a no-op on x86-64, where SSE2 is baseline and
        # FLT_EVAL_METHOD is already 0. It matters on 32-bit x86, where gcc
        # defaults to x87 and evaluates float expressions in 80 bits -- which
        # silently makes the library more accurate than the float32 it claims.
        # Printing it here means the tolerance figures always have a stated
        # precision behind them.
        run: |
          printf '#include <stdio.h>\n#include <float.h>\nint main(void){printf("FLT_EVAL_METHOD=%d, %zu-bit\\n", FLT_EVAL_METHOD, sizeof(void*)*8); return 0;}\n' > /tmp/fp.c
          gcc -O2 -msse2 -mfpmath=sse /tmp/fp.c -o /tmp/fp && /tmp/fp

      - name: Run the test suite
        run: make test PYTHON=python

  mutate:
    name: mutation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU) and NumPy
        # numpy is explicit: the oracle writer calls .numpy(), and the CPU torch
        # wheel does not always pull it in.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy
          python -c "import torch, numpy; print('torch', torch.__version__, '| numpy', numpy.__version__)"

      - name: Generate the oracle
        run: make oracle PYTHON=python

      # Breaks the library on purpose, one bug at a time, and fails if the tests
      # do not notice. A surviving mutation is a hole in the suite, and the job
      # exits non-zero so it cannot be missed.
      - name: Break it on purpose
        run: python tools/mutate.py

  train:
    name: it trains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A short run, checked for the one thing that must be true of any correct
      # language model at step 1: the loss starts at the entropy of a uniform
      # distribution over the vocabulary. A model that starts anywhere else is
      # misinitialised, and no amount of later training makes that fine.
      - name: Build the corpus
        run: make data/input.txt PYTHON=python

      - name: Build the trainer
        run: make build/train PYTHON=python

      - name: Train for 20 steps
        # pipefail: without it the pipeline reports tee's status, so a
        # trainer that crashed halfway would still pass this step and fail
        # the next one, blaming the wrong thing.
        run: |
          set -o pipefail
          ./build/train data/input.txt 20 | tee /tmp/train.log

      - name: Show the training log
        run: |
          wc -l /tmp/train.log
          cat -A /tmp/train.log | head -40

      # The log is read with errors="replace". It contains the generated text
      # sample, which is raw bytes the model emits in arbitrary order -- including
      # fragments of the multi-byte UTF-8 sequences in the corpus. That is not
      # valid UTF-8, so a strict read raises UnicodeDecodeError on Linux while
      # succeeding on Windows, where the default codec accepts any byte. Every
      # assertion here failed on that, not on what it was asserting.

      # Annotations are readable through the public API; logs are not. This is
      # the only way to see the runner's actual output without handing out a
      # token, and it is why the failing assertion could be diagnosed at all.
      - name: Publish the log as an annotation
        run: |
          python - <<'PYEOF'
          data = open("/tmp/train.log", encoding="utf-8", errors="replace").read()
          print("bytes:", len(data), " lines:", data.count(chr(10)))
          encoded = (data.replace("%", "%25")
                         .replace(chr(13), "%0D")
                         .replace(chr(10), "%0A"))
          print("::warning title=trainlog::" + encoded[:4000])
          PYEOF

      - name: Assert the log reports an expected initial loss
        run: |
          python - <<'PYEOF'
          import sys
          expected, losses = None, []
          for line in open("/tmp/train.log", encoding="utf-8", errors="replace"):
              parts = line.split()
              if parts[:3] == ["expected", "initial", "loss"]:
                  expected = float(parts[3])
              elif len(parts) >= 4 and parts[0] == "step" and parts[2] == "train":
                  losses.append(float(parts[3]))
          print("expected:", expected, " losses:", losses)
          if expected is None:
              sys.exit("no 'expected initial loss' line in the log")
          PYEOF

      - name: Assert at least two losses were reported
        run: |
          python - <<'PYEOF'
          import sys
          expected, losses = None, []
          for line in open("/tmp/train.log", encoding="utf-8", errors="replace"):
              parts = line.split()
              if parts[:3] == ["expected", "initial", "loss"]:
                  expected = float(parts[3])
              elif len(parts) >= 4 and parts[0] == "step" and parts[2] == "train":
                  losses.append(float(parts[3]))
          print("expected:", expected, " losses:", losses)
          if len(losses) < 2:
              sys.exit("saw %d reported losses, need 2" % len(losses))
          PYEOF

      - name: Assert the initial loss equals ln(vocab_size)
        run: |
          python - <<'PYEOF'
          import sys
          expected, losses = None, []
          for line in open("/tmp/train.log", encoding="utf-8", errors="replace"):
              parts = line.split()
              if parts[:3] == ["expected", "initial", "loss"]:
                  expected = float(parts[3])
              elif len(parts) >= 4 and parts[0] == "step" and parts[2] == "train":
                  losses.append(float(parts[3]))
          print("expected:", expected, " losses:", losses)
          # An untrained model is uniform over the vocabulary, so its loss
          # must be ln(vocab_size). Anything else is a broken initialisation,
          # and no amount of later training makes that acceptable.
          if abs(losses[0] - expected) > 0.15:
              sys.exit("initial loss %.4f is not ln(vocab_size) %.4f"
                       % (losses[0], expected))
          PYEOF

      - name: Assert the loss decreased
        run: |
          python - <<'PYEOF'
          import sys
          expected, losses = None, []
          for line in open("/tmp/train.log", encoding="utf-8", errors="replace"):
              parts = line.split()
              if parts[:3] == ["expected", "initial", "loss"]:
                  expected = float(parts[3])
              elif len(parts) >= 4 and parts[0] == "step" and parts[2] == "train":
                  losses.append(float(parts[3]))
          print("expected:", expected, " losses:", losses)
          if losses[-1] >= losses[0]:
              sys.exit("loss did not decrease: %.4f -> %.4f"
                       % (losses[0], losses[-1]))
          PYEOF
